[package]
name = "led-controller"
version = "0.1.0"
edition = "2021"
description = "Linux desktop app for controlling One94Store SR-SMD-SM BLE LED strips"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"
gdk = { package = "gdk4", version = "0.9" }
cairo-rs = { version = "0.20", features = ["v1_16"] }
bluer = { version = "0.17", features = ["full"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
palette = "0.7"

[profile.release]
opt-level = 3
lto = true
strip = true
